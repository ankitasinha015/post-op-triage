[project]
name = "post-op-triage"
version = "0.1.0"
description = "AI Triage Nurse — Post-Op Recovery Agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "streamlit>=1.33",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
