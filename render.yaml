services:
  - type: web
    name: ai-triage-nurse
    runtime: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npx vite build && cd ..
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "22"
